[project]
name = "pillar-demos"
version = "0.1.0"
description = "Engines and API behind the PILLAR Replan and Circuit Copilot demos"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["pillar_demos", "conftest", "test_replan"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette asks for httpx2 in its test client; httpx still works.
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
